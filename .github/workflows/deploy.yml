name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_REGISTRY: salesdemoecomm.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, inventory, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: microservices/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/ecomm-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_REGISTRY }}/ecomm-${{ matrix.service }}:latest

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Helm upgrade
        run: |
          helm upgrade --install ecomm helm/ecomm \
            --namespace ecomm \
            --create-namespace \
            --set image.registry=${{ env.ACR_REGISTRY }} \
            --set image.repositoryPrefix=ecomm \
            --set image.tag=${{ env.IMAGE_TAG }} \
            --set image.pullPolicy=Always \
            --set postgres.persistence.enabled=false \
            --wait \
            --timeout 5m
